x-build: &build
  context: .
  dockerfile: Dockerfile

x-runtime: &runtime
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - nc
      - -z
      - -w
      - "1"
      - 127.0.0.1
      - "8000"
    interval: 2s
    timeout: 1s
    start_period: 2s
    retries: 10

x-machine: &machine
  TZ: ${TZ:-UTC}
  LANG: ${LANG:-C.UTF-8}
  LC_ALL: ${LC_ALL:-C.UTF-8}

x-cache-client: &cache-client
  VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}

x-management-client: &management-client
  MANAGEMENT_URL: ${MANAGEMENT_URL:-http://management:8000}
  MANAGEMENT_SERVICE_TOKEN: ${MANAGEMENT_SERVICE_TOKEN:?}

x-gateway-routing: &gateway-routing
  GITHUB_URL: ${GITHUB_URL:-http://github:8000/mcp}
  GITLAB_URL: ${GITLAB_URL:-http://gitlab:8000/mcp}
  FILES_URL: ${FILES_URL:-http://files:8000/mcp}
  WEB_URL: ${WEB_URL:-http://web:8000/mcp}
  ANALYSIS_URL: ${ANALYSIS_URL:-http://analysis:8000/mcp}
  GHIDRA_URL: ${GHIDRA_URL:-http://ghidra:8000/mcp}
  TERMINAL_URL: ${TERMINAL_URL:-http://terminal:8000/mcp}
  OBSERVABILITY_URL: ${OBSERVABILITY_URL:-http://observability:8000/mcp}

x-observability: &observability
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mcp-bridge}
  OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-production}
  OTLP_ENDPOINT: ${OTLP_ENDPOINT:?}
  OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:?}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}

x-private-service: &private-service
  <<: *runtime

x-file-service: &file-service
  <<: *private-service
  volumes:
    - terminal-workspace:/workspace

services:
  valkey:
    restart: unless-stopped
    image: valkey/valkey:9.1.2-alpine
    environment:
      <<: *machine
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128

  management:
    <<: *runtime
    build:
      <<: *build
      target: management
    environment:
      <<: [*machine, *cache-client, *observability]
      MANAGEMENT_ENCRYPTION_KEY: ${MANAGEMENT_ENCRYPTION_KEY:?}
      MANAGEMENT_SERVICE_TOKEN: ${MANAGEMENT_SERVICE_TOKEN:?}
      MANAGEMENT_ADMIN_USERNAME: ${MANAGEMENT_ADMIN_USERNAME:-admin}
      MANAGEMENT_ADMIN_PASSWORD: ${MANAGEMENT_ADMIN_PASSWORD:?}
      MANAGEMENT_SESSION_SECRET: ${MANAGEMENT_SESSION_SECRET:?}
      MANAGEMENT_FRONTEND_TELEMETRY_UPSTREAM_URL: ${MANAGEMENT_FRONTEND_TELEMETRY_UPSTREAM_URL:-https://telemetry.koba-nexus.ru}
      MANAGEMENT_FRONTEND_TELEMETRY_BEARER_TOKEN: ${MANAGEMENT_FRONTEND_TELEMETRY_BEARER_TOKEN:-}
    volumes:
      - management:/management
      - terminal-workspace:/workspace

  management-ui:
    restart: unless-stopped
    build:
      context: ./admin-web-app
      dockerfile: Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 1s
      start_period: 1s
      retries: 10

  auth:
    <<: *runtime
    build:
      <<: *build
      target: auth
    environment:
      <<: [*machine, *cache-client, *management-client, *observability]
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-${SERVICE_URL_GATEWAY_8000}}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?}
      GITHUB_OAUTH_JWT_SIGNING_KEY: ${GITHUB_OAUTH_JWT_SIGNING_KEY:?}
      GITHUB_OAUTH_ALLOWED_USERS: ${GITHUB_OAUTH_ALLOWED_USERS:?}
    volumes:
      - auth:/auth

  gateway:
    <<: *runtime
    build:
      <<: *build
      target: gateway
    environment:
      <<: [*machine, *cache-client, *management-client, *gateway-routing, *observability]
      SERVICE_URL_GATEWAY_8000: /
      OAUTH_ENABLED: ${OAUTH_ENABLED:-true}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-${SERVICE_URL_GATEWAY_8000}}
      GITHUB_OAUTH_JWT_SIGNING_KEY: ${GITHUB_OAUTH_JWT_SIGNING_KEY:?}
      GITHUB_OAUTH_ALLOWED_USERS: ${GITHUB_OAUTH_ALLOWED_USERS:?}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-${SERVICE_FQDN_GATEWAY_8000}}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-${SERVICE_URL_GATEWAY_8000}}

  github:
    <<: *private-service
    depends_on:
      management:
        condition: service_healthy
        required: true
    build:
      <<: *build
      target: github
    environment:
      <<: [*machine, *cache-client, *management-client, *observability]
      GITHUB_AGENT_PROTECTED_BRANCHES: "${GITHUB_AGENT_PROTECTED_BRANCHES:-}"
    volumes:
      - terminal-workspace:/workspace

  gitlab:
    <<: *private-service
    depends_on:
      management:
        condition: service_healthy
        required: true
    build:
      <<: *build
      target: gitlab
    environment:
      <<: [*machine, *cache-client, *management-client, *observability]
      GITLAB_PROTECTED_BRANCHES: "${GITLAB_PROTECTED_BRANCHES:-}"
    volumes:
      - terminal-workspace:/workspace

  files:
    <<: *file-service
    build:
      <<: *build
      target: files
    environment:
      <<: [*machine, *cache-client, *management-client, *observability]

  web:
    <<: *file-service
    build:
      <<: *build
      target: web
    environment:
      <<: [*cache-client, *management-client, *observability]
      TZ: ${TZ:-UTC}
      WEB_MEMORY_LIMIT: ${WEB_MEMORY_LIMIT:-1792m}
      WEB_MEMORY_SWAP_LIMIT: ${WEB_MEMORY_SWAP_LIMIT:-1792m}
      WEB_SHM_SIZE: ${WEB_SHM_SIZE:-1gb}
    volumes:
      - terminal-workspace:/workspace
      - web-browser:/browser
    devices:
      - ${BROWSER_DRI_DEVICE:-/dev/dri/renderD128}:${BROWSER_DRI_DEVICE:-/dev/dri/renderD128}
    shm_size: ${WEB_SHM_SIZE:-1gb}
    mem_limit: ${WEB_MEMORY_LIMIT:-1792m}
    memswap_limit: ${WEB_MEMORY_SWAP_LIMIT:-1792m}

  terminal:
    <<: *private-service
    build:
      <<: *build
      target: terminal
    environment:
      <<: [*machine, *cache-client, *management-client, *observability]
      TERMINAL_LANG: ${TERMINAL_LANG:-${LANG:-C.UTF-8}}
    mem_limit: ${TERMINAL_MEMORY_LIMIT:-2g}
    memswap_limit: ${TERMINAL_MEMORY_SWAP_LIMIT:-2g}
    cpus: ${TERMINAL_CPU_LIMIT:-1.5}
    pids_limit: ${TERMINAL_PIDS_LIMIT:-256}
    volumes:
      - terminal-workspace:/workspace
      - terminal-home:/home/agent

  analysis:
    <<: *private-service
    depends_on:
      ghidra:
        condition: service_healthy
        required: true
    build:
      <<: *build
      target: analysis
    environment:
      <<: [*machine, *cache-client, *management-client, *observability]
      GHIDRA_URL: ${GHIDRA_URL:-http://ghidra:8000/mcp}
      ASGI_WORKERS: ${ANALYSIS_WORKERS:-1}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-1}
      ANALYSIS_MEMORY_LIMIT: ${ANALYSIS_MEMORY_LIMIT:-2g}
    mem_limit: ${ANALYSIS_MEMORY_LIMIT:-2g}
    volumes:
      - terminal-workspace:/workspace

  ghidra:
    <<: *private-service
    build:
      <<: *build
      target: ghidra
    environment:
      <<: [*machine, *cache-client, *management-client, *observability]
      GHIDRA_MCP_URL: ${GHIDRA_MCP_URL:-http://bridge:8081/mcp}
      ASGI_WORKERS: ${GHIDRA_WORKERS:-1}
      GHIDRA_WORKERS: ${GHIDRA_WORKERS:-1}
      GHIDRA_MEMORY_LIMIT: ${GHIDRA_MEMORY_LIMIT:-2g}
    mem_limit: ${GHIDRA_MEMORY_LIMIT:-2g}
    networks:
      - default
      - coolify

  observability:
    <<: *private-service
    depends_on:
      management:
        condition: service_healthy
        required: true
    build:
      <<: *build
      target: observability
    environment:
      <<: [*machine, *cache-client, *management-client, *observability]

volumes:
  management:
  auth:
  terminal-workspace:
  terminal-home:
  web-browser:

networks:
  coolify:
    external: true
    name: coolify
