x-watch-path-coolify:
  - "services/platform/**"
  - "services/common/**"  # transitional cross-service imports
  - "shared/build/**"
  - "services/external/**"

# Coolify parses literals and Required ENV before resolving Shared references.
services:
  briareus-platform:
    extends:
      file: docker-compose.yaml
      service: briareus-platform
    volumes:
      - panel-peer:/run/briareus-platform
      - platform-state:/var/lib/briareus-platform
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
      POSTGRES_HOST: "briareus-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "briareus_platform"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      PLATFORM_MANAGED_PEER: "1"
      PLATFORM_PANEL_SOCKET: /run/briareus-platform/platform/panel.sock
      PLATFORM_PANEL_VERIFY_KEY_FILE: /run/briareus-platform/panel-signing.pub
      RAUTHY_USERS_READ_KEY_FILE: /var/lib/briareus-platform/rauthy-users-read.key
volumes:
  panel-peer:
    name: briareus-dev-panel-peer-3xshlpoghb9wcyhjgktlqzzp
  platform-state: {}
networks:
  briareus:
    external: true
    name: briareus-net
